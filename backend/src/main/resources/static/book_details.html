<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Details</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="assets/img/logo.png" alt="Alexandria Books">
        </a>
        <div class="nav-links">
            <a href="index.html">Back to Store</a>
            <a href="cart.html">Cart</a>
        </div>
    </nav>

    <div class="container" style="margin-top: 2rem;">
        <div id="book-container" style="display: grid; grid-template-columns: 300px 1fr; gap: 3rem; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <p>Loading Details...</p>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/cart.js"></script> <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const isbn = params.get("isbn");
            const container = document.getElementById("book-container");

            if (!isbn) {
                container.innerHTML = "<p>No book selected.</p>";
                return;
            }

            try {
                const res = await fetch(`http://localhost:8080/api/books/${isbn}`);
                if (!res.ok) throw new Error("Book not found");
                const book = await res.json();

                // Format Authors List
                const authors = book.authors ? book.authors.join(", ") : (book.publisher && book.publisher.name ? 'Unknown Author' : 'Unknown Author');

                container.innerHTML = `
                    <div style="text-align: center;">
                        <img src="${book.coverImage || 'assets/img/book_placeholder.jpg'}" alt="Book Cover" style="width: 100%; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
                    </div>

                    <div>
                        <h1 style="margin-bottom: 0.5rem;">${book.title}</h1>
                        <p style="color: #666; font-size: 1.1rem; margin-bottom: 1rem;">By ${authors}</p>
                        <p style="color: #888; font-size: 0.9rem;">Publisher: ${ (book.publisher && book.publisher.name) ? book.publisher.name : (book.publisherName || 'Unknown') } (${book.publicationYear || ''})</p>
                        
                        <div style="margin-bottom: 1.5rem; margin-top: 1rem;">
                            <span style="background: #e0e7ff; color: var(--primary); padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.9rem; font-weight: bold;">${book.category}</span>
                            <span style="background: ${book.stockQuantity > 0 ? '#dcfce7' : '#fee2e2'}; color: ${book.stockQuantity > 0 ? '#166534' : '#991b1b'}; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.9rem; font-weight: bold; margin-left: 0.5rem;">
                                ${book.stockQuantity > 0 ? 'In Stock: ' + book.stockQuantity : 'Out of Stock'}
                            </span>
                        </div>

                        <h2 style="color: var(--primary); margin-bottom: 1rem;">$${book.price.toFixed(2)}</h2>

                        <p style="line-height: 1.8; color: #4b5563; margin-bottom: 2rem;">
                            ISBN: ${book.isbn}<br>
                            This is a great book in the ${book.category} category. Add it to your collection today!
                        </p>

                        <div style="display: flex; gap: 1rem;">
                            <button class="btn-submit" style="width: auto; padding: 0 2rem;" 
                                onclick="addToCart('${book.isbn}')" 
                                ${book.stockQuantity > 0 ? '' : 'disabled style="background:grey; cursor:not-allowed;"'}>
                                Add to Cart
                            </button>
                        </div>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = "<p>Error loading book details.</p>";
            }
        });
    </script>
</body>
</html>
