<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="assets/img/logo.png" style="height:50px;"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="order_history.html">My Orders</a>
            <a href="#" onclick="logout()" class="btn btn-danger">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2>Edit Your Profile</h2>
            <form id="profile-form">
                <div class="form-group">
                    <label>Username (Cannot be changed)</label>
                    <input type="text" name="username" id="p-username" disabled style="background: #e2e8f0;">
                </div>
                
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="password" id="p-password" placeholder="Leave blank to keep current">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="firstName" id="p-fname">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="lastName" id="p-lname">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" id="p-email">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phoneNumber" id="p-phone" pattern="^(0[0-9]{10}|\+[0-9]{11})$" title="Must be 11 digits starting with 0, or 12 digits starting with + (e.g. 01234567890 or +201234567890)" inputmode="numeric" required>
                </div>

                <div class="form-group">
                    <label>Shipping Address</label>
                    <input type="text" name="shippingAddress" id="p-address">
                </div>

                <button type="submit" class="btn-submit">Update Profile</button>
            </form>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        // 1. Pre-fill form with current user data
        document.addEventListener("DOMContentLoaded", () => {
            const user = JSON.parse(localStorage.getItem("user"));
            if (!user) window.location.href = "login.html";

            document.getElementById("p-username").value = user.username;
            // Do not prefill password; leave blank to keep current
            document.getElementById("p-password").value = "";
            document.getElementById("p-fname").value = user.firstName || '';
            document.getElementById("p-lname").value = user.lastName || '';
            document.getElementById("p-email").value = user.email || '';

            // Support older localStorage keys just in case
            const phone = user.phoneNumber || user.phone || user.phoneNo || '';
            const addr = user.shippingAddress || user.address || '';
            const phoneEl = document.getElementById("p-phone");
            if (phoneEl) phoneEl.value = phone;
            document.getElementById("p-address").value = addr;
        });

        // 2. Submit Update
        document.getElementById("profile-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const updatedUser = Object.fromEntries(formData.entries());
            
            const existingUser = JSON.parse(localStorage.getItem("user")) || {};

            // We must include the username so the backend knows who to update
            updatedUser.username = document.getElementById("p-username").value;

            // If password left blank, keep current password
            if (!updatedUser.password || String(updatedUser.password).trim() === "") {
                updatedUser.password = existingUser.password || "";
            }

            try {
                const res = await fetch("http://localhost:8080/api/users/profile", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(updatedUser)
                });
                const text = await res.text();
                alert(text);
                
                if(text.includes("Success")) {
                    // Merge changes into local storage so fields like isAdmin are preserved
                    const merged = {
                        ...existingUser,
                        ...updatedUser
                    };
                    localStorage.setItem("user", JSON.stringify(merged));
                }
            } catch (err) { console.error(err); }
        });
    </script>
</body>
</html>
