<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="admin_dashboard.html" class="logo">
            <img src="assets/img/logo.png" alt="Alexandria Books">
        </a>
        <div class="nav-links">
            <a href="admin_dashboard.html">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <h1>Manage Customers</h1>
        <p>Promote trusted customers to Managers.</p>

        <table class="styled-table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                </tbody>
        </table>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const tbody = document.getElementById("user-table-body");
            try {
                const res = await fetch("http://localhost:8080/api/users/customers");
                const users = await res.json();
                
                users.forEach(user => {
                    const row = `
                        <tr>
                            <td>${user.username}</td>
                            <td>${user.firstName} ${user.lastName}</td>
                            <td>${user.email}</td>
                            <td>
                                <button class="btn-submit btn-success" 
                                    style="width: auto; padding: 0.5rem 1rem;"
                                    onclick="promoteUser('${user.username}')">
                                    Promote to Manager
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (err) { console.error(err); }
        });

        async function promoteUser(username) {
            if(!confirm(`Are you sure you want to promote ${username}?`)) return;
            
            await fetch(`http://localhost:8080/api/users/promote/${username}`, { method: "PUT" });
            alert("User promoted successfully!");
            location.reload();
        }
    </script>
</body>
</html>
