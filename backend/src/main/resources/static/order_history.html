<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Past Orders</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="assets/img/logo.png" alt="Alexandria Books">
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="edit_profile.html">Edit Profile</a>
        </div>
    </nav>

    <div class="container">
        <h2>My Order History</h2>
        
        <table class="styled-table">
            <thead>
                <tr>
                    <th>Order No</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="order-table-body">
                </tbody>
        </table>
    </div>

    <script src="assets/js/cart.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const user = JSON.parse(localStorage.getItem("user"));
            if (!user) window.location.href = "login.html";

            const tbody = document.getElementById("order-table-body");
            const res = await fetch(`http://localhost:8080/api/orders/history/${user.username}`);
            const orders = await res.json();

            if(orders.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3'>No past orders found.</td></tr>";
                return;
            }

            // For each order, fetch its items to compute total and render a row with expandable details
            for (const order of orders) {
                const itemsRes = await fetch(`http://localhost:8080/api/orders/details/${order.orderId}`);
                const items = await itemsRes.json();
                const total = items.reduce((s, it) => s + (it.priceAtPurchase || it.price || 0) * (it.quantity || 1), 0);

                const rowId = `order-row-${order.orderId}`;
                const detailsId = `order-details-${order.orderId}`;

                const row = `
                    <tr id="${rowId}">
                        <td>#${order.orderId}</td>
                        <td>${order.orderDate}</td>
                        <td>$${total.toFixed(2)}</td>
                        <td>
                            <button class="btn-submit" 
                                style="width: auto; padding: 0.5rem 1rem; background: #64748b;"
                                onclick="toggleDetails('${detailsId}')">
                                View Items
                            </button>
                        </td>
                    </tr>
                    <tr id="${detailsId}" class="order-details-row" style="display:none;">
                        <td colspan="4">
                            <table style="width:100%; border-collapse:collapse;">
                                <thead>
                                    <tr>
                                        <th>ISBN</th>
                                        <th>Title</th>
                                        <th>Qty</th>
                                        <th>Price</th>
                                        <th>Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${items.map(it => `
                                        <tr>
                                            <td>${it.bookIsbn}</td>
                                            <td>${it.title}</td>
                                            <td>${it.quantity}</td>
                                            <td>$${(it.priceAtPurchase || it.price || 0).toFixed(2)}</td>
                                            <td>$${(((it.priceAtPurchase || it.price || 0) * it.quantity) || 0).toFixed(2)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            }
        });

        function toggleDetails(detailsId) {
            const el = document.getElementById(detailsId);
            if (!el) return;
            el.style.display = (el.style.display === 'none' || !el.style.display) ? 'table-row' : 'none';
        }
    </script>
</body>
</html>
