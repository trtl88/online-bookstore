<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Past Orders</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="assets/img/logo.png" alt="Alexandria Books">
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="edit_profile.html">Edit Profile</a>
        </div>
    </nav>

    <div class="container">
        <h2>My Order History</h2>
        
        <table class="styled-table">
            <thead>
                <tr>
                    <th>Order No</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="order-table-body">
                </tbody>
        </table>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const user = JSON.parse(localStorage.getItem("user"));
            if (!user) window.location.href = "login.html";

            const tbody = document.getElementById("order-table-body");
            const res = await fetch(`http://localhost:8080/api/orders/history/${user.username}`);
            const orders = await res.json();

            if(orders.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3'>No past orders found.</td></tr>";
                return;
            }

            orders.forEach(order => {
                const row = `
                    <tr>
                        <td>#${order.orderId}</td>
                        <td>${order.orderDate}</td>
                        <td>
                            <button class="btn-submit" 
                                style="width: auto; padding: 0.5rem 1rem; background: #64748b;"
                                onclick="viewDetails(${order.orderId})">
                                View Items
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });

        async function viewDetails(orderId) {
            const res = await fetch(`http://localhost:8080/api/orders/details/${orderId}`);
            const items = await res.json();
            let details = "Items in Order #" + orderId + ":\n\n";
            items.forEach(item => {
                details += `- ${item.title} (Qty: ${item.quantity}) - $${item.priceAtPurchase}\n`;
            });
            alert(details);
        }
    </script>
</body>
</html>
