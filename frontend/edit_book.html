<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modify Books - Admin</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="admin_dashboard.html" class="logo">Admin Panel</a>
        <div class="nav-links">
            <a href="admin_dashboard.html">Back to Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <h2>Modify Existing Books</h2>
        
        <div style="background: white; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
            <h4>Search Book to Edit</h4>
            <form style="display: flex; gap: 1rem;">
                <input type="text" placeholder="Enter ISBN or Title..." style="flex: 1; padding: 0.5rem;">
                <button class="btn-submit" style="width: auto; margin:0;">Search</button>
            </form>
        </div>

        <div class="form-container" style="margin: 0; max-width: 100%;">
            <h3>Edit Details: "Database Systems"</h3>
            <form action="#" method="POST">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Stock Quantity</label>
                        <input type="number" name="stock" value="50">
                    </div>
                    <div class="form-group">
                        <label>Price ($)</label>
                        <input type="number" step="0.01" name="price" value="50.00">
                    </div>
                    <div class="form-group">
                        <label>Threshold</label>
                         <input type="number" name="threshold" value="5">
                    </div>
                </div>
                <button type="submit" class="btn-submit">Save Changes</button>
            </form>
        </div>
    </div>
</body>
</html>
