<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
       <a href="index.html" class="logo">
            <img src="assets/img/logo.png" alt="Alexandria Books">
       </a>
        <div class="nav-links">
            <a href="cart.html">Back to Cart</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container" style="max-width: 600px;">
            <h2 style="border-bottom: 2px solid #eee; padding-bottom: 1rem; margin-bottom: 1.5rem;">Secure Checkout</h2>
            
            <form id="checkout-form">
                <h4 style="margin-bottom: 1rem;">Payment Details</h4>
                <div class="form-group">
                    <label>Credit Card Number</label>
                    <input type="text" name="cc" placeholder="0000 0000 0000 0000" maxlength="19" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Expiry Date (MM/YY)</label>
                        <input type="text" name="expiry" placeholder="12/25" required>
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="text" placeholder="123" maxlength="3" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit" style="margin-top: 1rem;">Pay & Place Order</button>
            </form>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById("checkout-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem("user"));
            if (!user) { alert("Please login first."); window.location.href = "login.html"; return; }

            const formData = new FormData(e.target);
            const cc = formData.get("cc");
            const expiry = formData.get("expiry");

            // Encode params for URL query string
            const params = new URLSearchParams({
                username: user.username,
                cc: cc,
                expiry: expiry
            });

            try {
                const res = await fetch(`http://localhost:8080/api/orders/checkout?${params}`, { method: "POST" });
                const text = await res.text();
                
                if (text.includes("Success")) {
                    alert("Order Placed Successfully!");
                    window.location.href = "order_history.html";
                } else {
                    alert("Checkout Failed: " + text);
                }
            } catch (err) { console.error(err); alert("Error connecting to server."); }
        });
    </script>
</body>
</html>
