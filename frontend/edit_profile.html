<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo"><img src="assets/img/logo.png" style="height:80px;"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="order_history.html">My Orders</a>
            <a href="index.html" class="btn" style="background: #ef4444;">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2>Edit Your Profile</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label>Username (Cannot be changed)</label>
                    <input type="text" name="username" value="mohamed8915" disabled style="background: #e2e8f0;">
                </div>
                
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="password" placeholder="Leave blank to keep current">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="first_name" value="Mohamed">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" name="last_name" value="ElBoghdadi">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" value="mohamed@example.com">
                </div>

                <div class="form-group">
                    <label>Shipping Address</label>
                    <input type="text" name="address" value="123 Alexandria St, Egypt">
                </div>

                <button type="submit" class="btn-submit">Update Profile</button>
            </form>
        </div>
    </div>
</body>
</html>
