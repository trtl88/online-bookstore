# Docker Compose for using pre-built DockerHub images
# Use this on servers or machines without the source code

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bookstore-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: online_bookstore
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookstore-network

  backend:
    image: trtl88/bookstore-backend:latest
    container_name: bookstore-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/online_bookstore?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bookstore-network

  frontend:
    image: trtl88/bookstore-frontend:latest
    container_name: bookstore-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bookstore-network

volumes:
  mysql_data:

networks:
  bookstore-network:
    driver: bridge
